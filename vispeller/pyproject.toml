[project]
name = "vispeller"
version = "0.1.0"
description = "Spelling checker for Vietnamese language"
requires-python = ">=3.12"

dependencies = [
    "openpyxl",
    "underthesea",
    "nltk",
    "tqdm",
    "spylls",
    "python-dateutil",
    "phonenumbers",
    "price-parser",
    "python-multipart",
    "fastapi",
    "uvicorn[standard]",
    "reportlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vispeller"]

[dependency-groups]
dev = [
    "pyinstaller",
]
